name: Deploy OHIF static site to Azure Storage ($web)

on:
  push:
    branches: [develop, production]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Pick target storage account by branch
        id: target
        run: |
          if [ "${GITHUB_REF_NAME}" = "develop" ]; then
            echo "account=extravisionohif" >> $GITHUB_OUTPUT
          elif [ "${GITHUB_REF_NAME}" = "production" ]; then
            echo "account=stdicomdata" >> $GITHUB_OUTPUT
          else
            echo "Unsupported branch: ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Clean $web except app-config.js (handle directory markers)
        run: |
          set -euo pipefail
          ACCOUNT="${{ steps.target.outputs.account }}"
          CONTAINER='$web'
          
          # 1) Видаляємо все, крім app-config.js, АЛЕ пропускаємо "folder markers" без слеша
          # (assets, static, etc.) — видалимо їх після того, як вичистимо їхній вміст.
          az storage blob list \
            --account-name "$ACCOUNT" \
            --container-name "$CONTAINER" \
            --auth-mode login \
            --query "[?name!='app-config.js' && contains(name,'/')].name" -o tsv \
          | while IFS= read -r blob; do
              [ -z "$blob" ] && continue
              echo "Deleting blob: $blob"
              az storage blob delete \
                --account-name "$ACCOUNT" \
                --container-name "$CONTAINER" \
                --name "$blob" \
                --auth-mode login
            done
          
          # 2) Тепер видаляємо верхньорівневі файли (без /), крім app-config.js
          # і крім "folder markers", які Azure може вважати директорією.
          az storage blob list \
            --account-name "$ACCOUNT" \
            --container-name "$CONTAINER" \
            --auth-mode login \
            --query "[?name!='app-config.js' && !contains(name,'/')].name" -o tsv \
          | while IFS= read -r blob; do
              [ -z "$blob" ] && continue
              echo "Deleting top-level blob: $blob"
              az storage blob delete \
                --account-name "$ACCOUNT" \
                --container-name "$CONTAINER" \
                --name "$blob" \
                --auth-mode login || true
            done

      - name: Deploy dist to $web (do not overwrite app-config.js)
        run: |
          set -euo pipefail
          ACCOUNT="${{ steps.target.outputs.account }}"

          # Не даємо випадково перезаписати app-config.js
          rm -f platform/app/dist/app-config.js

          az storage blob upload-batch \
            --account-name "$ACCOUNT" \
            --destination '$web' \
            --source "platform/app/dist" \
            --overwrite true \
            --auth-mode login
